<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Radial glow for a deep space effect -->
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0f2b5a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#050811" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Linear fade for the grid mask -->
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Futuristic Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
    
    <!-- Mask to fade out the grid at the bottom -->
    <mask id="grid-mask">
      <rect width="900" height="300" fill="url(#fade)"/>
    </mask>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark background -->
  <rect width="900" height="300" fill="#030712"/>
  
  <!-- Glowing aura at the top -->
  <rect width="900" height="300" fill="url(#glow)"/>
  
  <!-- Fading Grid overlay -->
  <rect width="900" height="300" fill="url(#grid)" mask="url(#grid-mask)"/>
  
  <!-- GitHub-style circular glow ring -->
  <circle cx="450" cy="320" r="220" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="450" cy="320" r="220" fill="none" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.08" filter="url(#neon-glow)"/>
  
  <!-- Subtle Octocat-like silhouette arching behind text -->
  <path d="M 310 320 C 310 200, 360 140, 410 130 C 415 100, 425 85, 435 95 C 445 105, 455 105, 465 95 C 475 85, 485 100, 490 130 C 540 140, 590 200, 590 320" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.15" filter="url(#neon-glow)"/>

  <!-- Decorative nodes/dots on the geometric outline -->
  <circle cx="361" cy="188" r="2.5" fill="#93c5fd" opacity="0.6"/>
  <circle cx="539" cy="188" r="2.5" fill="#93c5fd" opacity="0.6"/>
  <circle cx="450" cy="100" r="3" fill="#93c5fd" opacity="0.8" filter="url(#neon-glow)"/>

  <!-- TEXT CONTENT ON TOP OF BACKGROUND -->
  <!-- Name -->
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">Sri Pon Rama S</text>
  
  <!-- Title -->
  <text x="450" y="195" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#93c5fd" letter-spacing="0.5">AI &amp; Data Science Student</text>
  
  <!-- Tagline -->
  <text x="450" y="250" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#67A2C5" letter-spacing="1.5">BUILDING SYSTEMS. SOLVING PROBLEMS. LEARNING BY DOING.</text>

</svg>
