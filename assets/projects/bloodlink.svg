<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    .bg { fill: rgba(220, 38, 38, 0.1); }
    .accent { fill: #ef4444; }
    
    @keyframes fall {
      0% { transform: translateY(-8px) scale(0); opacity: 0; }
      20% { transform: translateY(-4px) scale(1); opacity: 1; }
      50% { transform: translateY(4px) scale(1); opacity: 1; }
      51% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 50% { transform: scale(1); }
      55% { transform: scale(1.1); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    .drop-small { animation: fall 2s infinite ease-in; transform-origin: center; }
    .drop-main { animation: pulse 2s infinite ease-out; transform-origin: 20px 25px; }
    
    @media (prefers-reduced-motion: reduce) {
      .drop-small { animation: none; opacity: 0; }
      .drop-main { animation: none; }
    }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <g class="drop-main">
    <path d="M20,14 C20,14 13,23 13,27 A7,7 0 0,0 27,27 C27,23 20,14 20,14 Z" class="accent"/>
  </g>
  <g class="drop-small">
    <path d="M20,6 C20,6 18,9 18,10.5 A2,2 0 0,0 22,10.5 C22,9 20,6 20,6 Z" class="accent"/>
  </g>
</svg>
