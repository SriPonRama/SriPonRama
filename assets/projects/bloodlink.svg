<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    @media (prefers-color-scheme: dark) { .accent { stroke: #2f81f7; } .bg { fill: rgba(47, 129, 247, 0.1); } }
    @media (prefers-color-scheme: light) { .accent { stroke: #0969da; } .bg { fill: rgba(9, 105, 218, 0.1); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.4); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .pulse-ring { transform-origin: center; animation: pulse 2s infinite ease-out; }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <circle cx="20" cy="20" r="4" class="accent pulse-ring" stroke-width="1.5" fill="none"/>
  <path d="M12,20 L16,20 L18,15 L22,25 L24,20 L28,20" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
