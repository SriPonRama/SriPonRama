<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    @media (prefers-color-scheme: dark) { .accent { stroke: #2f81f7; } .bg { fill: rgba(47, 129, 247, 0.1); } }
    @media (prefers-color-scheme: light) { .accent { stroke: #0969da; } .bg { fill: rgba(9, 105, 218, 0.1); } }
    @keyframes radar { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    .radar-ring { transform-origin: center; animation: radar 2s infinite linear; }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <path d="M20,12 C24,12 26,15 26,18 C26,22 20,28 20,28 C20,28 14,22 14,18 C14,15 16,12 20,12 Z" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="17" r="2" class="accent" stroke-width="1.5" fill="none"/>
  <circle cx="20" cy="20" r="14" class="accent radar-ring" stroke-width="1" fill="none"/>
</svg>
