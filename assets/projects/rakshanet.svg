<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    .bg { fill: rgba(16, 185, 129, 0.1); }
    .accent { fill: none; stroke: #10b981; }
    .accent-fill { fill: #10b981; }
    
    @keyframes pop {
      0% { transform: translateY(6px) scale(0.8); }
      15% { transform: translateY(-4px) scale(1.1); }
      30% { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes ripple {
      0% { transform: scale(0.5); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0; }
      100% { opacity: 0; }
    }
    .pin { animation: pop 2.5s infinite ease-in-out; transform-origin: 20px 28px; }
    .base-ripple { animation: ripple 2.5s infinite ease-out; transform-origin: 20px 28px; }
    
    @media (prefers-reduced-motion: reduce) {
      .pin { animation: none; }
      .base-ripple { animation: none; display: none; }
    }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <!-- Target Base -->
  <ellipse cx="20" cy="28" rx="6" ry="2" class="accent" stroke-width="1"/>
  <ellipse cx="20" cy="28" rx="6" ry="2" class="accent base-ripple" stroke-width="1"/>
  
  <!-- Pin -->
  <g class="pin">
    <path d="M20,10 C16,10 13,13 13,17 C13,22 20,28 20,28 C20,28 27,22 27,17 C27,13 24,10 20,10 Z" class="accent" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="16" r="2.5" class="accent-fill"/>
  </g>
</svg>
