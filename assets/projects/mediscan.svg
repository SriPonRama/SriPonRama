<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    .bg { fill: rgba(6, 182, 212, 0.1); }
    .accent { stroke: #06b6d4; }
    
    @keyframes draw {
      0% { stroke-dashoffset: 60; }
      80% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fade {
      0%, 80% { opacity: 1; }
      90% { opacity: 0; }
      100% { opacity: 1; }
    }
    .pulse-line {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 2s infinite linear, fade 2s infinite;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .pulse-line { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <path d="M6,20 L12,20 L15,12 L20,28 L24,20 L34,20" class="accent pulse-line" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
