<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    @media (prefers-color-scheme: dark) { .accent { stroke: #2f81f7; } .bg { fill: rgba(47, 129, 247, 0.1); } .scan { stroke: rgba(47, 129, 247, 0.6); } }
    @media (prefers-color-scheme: light) { .accent { stroke: #0969da; } .bg { fill: rgba(9, 105, 218, 0.1); } .scan { stroke: rgba(9, 105, 218, 0.6); } }
    @keyframes scanline { 0% { transform: translateY(-8px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
    .scan-line { animation: scanline 2s infinite linear; }
  </style>
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg"/>
  <rect x="12" y="10" width="16" height="20" rx="2" class="accent" stroke-width="1.5" fill="none"/>
  <path d="M16,14 L24,14 M16,18 L20,18 M16,22 L24,22" class="accent" stroke-width="1" fill="none" stroke-linecap="round"/>
  <line x1="10" y1="13" x2="30" y2="13" class="scan scan-line" stroke-width="2" stroke-linecap="round"/>
</svg>
