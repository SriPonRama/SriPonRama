<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <style>
    @media (prefers-color-scheme: dark) {
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #7d8590; }
      .accent { stroke: #2f81f7; }
      .accent-bg { fill: #2f81f7; opacity: 0.1; }
      .divider { stroke: #30363d; }
    }
    @media (prefers-color-scheme: light) {
      .text-title { fill: #1f2328; }
      .text-desc { fill: #656d76; }
      .accent { stroke: #0969da; }
      .accent-bg { fill: #0969da; opacity: 0.1; }
      .divider { stroke: #d0d7de; }
    }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
    .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .divider { stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    @keyframes fade-build {
      0% { opacity: 0; transform: translateY(15px); }
      12.5% { opacity: 1; transform: translateY(0); }
      87.5% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-15px); }
    }
    @keyframes fade-solve {
      0%, 12.5% { opacity: 0; transform: translateY(15px); }
      25% { opacity: 1; transform: translateY(0); }
      87.5% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-15px); }
    }
    @keyframes fade-ship {
      0%, 25% { opacity: 0; transform: translateY(15px); }
      37.5% { opacity: 1; transform: translateY(0); }
      87.5% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-15px); }
    }
    
    .build { animation: fade-build 8s infinite; }
    .solve { animation: fade-solve 8s infinite; }
    .ship { animation: fade-ship 8s infinite; }
  </style>

  <!-- BUILD (Left: 133) -->
  <g class="build">
    <!-- Centered Icon at X=133, Y=60 -->
    <rect x="109" y="36" width="48" height="48" rx="8" class="accent-bg"/>
    <g transform="translate(133, 60) scale(1.3)">
      <path d="M-6,-6 L-10,0 L-6,6 M6,-6 L10,0 L6,6 M-2,8 L2,-8" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Centered Title and Desc -->
    <text x="133" y="120" class="text-title" text-anchor="middle">BUILD</text>
    <text x="133" y="145" class="text-desc" text-anchor="middle">Architecting practical</text>
    <text x="133" y="165" class="text-desc" text-anchor="middle">full-stack systems</text>
  </g>

  <!-- Arrow between BUILD and SOLVE (Fades with SOLVE) -->
  <g class="solve">
    <line x1="230" y1="60" x2="270" y2="60" class="divider" />
    <path d="M264,54 L270,60 L264,66" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SOLVE (Center: 400) -->
  <g class="solve">
    <!-- Centered Icon at X=400, Y=60 -->
    <rect x="376" y="36" width="48" height="48" rx="8" class="accent-bg"/>
    <g transform="translate(400, 60) scale(1.3)">
      <circle cx="0" cy="0" r="5" class="accent" stroke-width="1.5" fill="none"/>
      <path d="M0,-8 L0,-5 M0,5 L0,8 M-8,0 L-5,0 M5,0 L8,0 M-6,-6 L-4,-4 M4,4 L6,6 M-6,6 L-4,4 M4,-4 L6,-6" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Centered Title and Desc -->
    <text x="400" y="120" class="text-title" text-anchor="middle">SOLVE</text>
    <text x="400" y="145" class="text-desc" text-anchor="middle">Tackling algorithmic</text>
    <text x="400" y="165" class="text-desc" text-anchor="middle">and technical problems</text>
  </g>

  <!-- Arrow between SOLVE and SHIP (Fades with SHIP) -->
  <g class="ship">
    <line x1="530" y1="60" x2="570" y2="60" class="divider" />
    <path d="M564,54 L570,60 L564,66" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SHIP (Right: 667) -->
  <g class="ship">
    <!-- Centered Icon at X=667, Y=60 -->
    <rect x="643" y="36" width="48" height="48" rx="8" class="accent-bg"/>
    <g transform="translate(667, 60) scale(1.3)">
      <path d="M0,-8 L4,-4 V4 L0,8 L-4,4 V-4 Z M-4,4 L-8,8 M4,4 L8,8 M0,8 V12" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Centered Title and Desc -->
    <text x="667" y="120" class="text-title" text-anchor="middle">SHIP</text>
    <text x="667" y="145" class="text-desc" text-anchor="middle">Turning ideas into</text>
    <text x="667" y="165" class="text-desc" text-anchor="middle">working software</text>
  </g>
</svg>
