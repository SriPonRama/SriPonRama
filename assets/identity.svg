<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%">
  <style>
    @media (prefers-color-scheme: dark) {
      .text-title { fill: #e6edf3; }
      .text-desc { fill: #7d8590; }
      .accent { stroke: #2f81f7; }
      .accent-bg { fill: #2f81f7; opacity: 0.1; }
      .divider { stroke: #30363d; }
    }
    @media (prefers-color-scheme: light) {
      .text-title { fill: #1f2328; }
      .text-desc { fill: #656d76; }
      .accent { stroke: #0969da; }
      .accent-bg { fill: #0969da; opacity: 0.1; }
      .divider { stroke: #d0d7de; }
    }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
    .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .divider { stroke-width: 1; stroke-dasharray: 3 4; }
    
    @keyframes cascade {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    .seq-1 { opacity: 0; animation: cascade 1s ease-out forwards; animation-delay: 0.2s; }
    .line-1 { opacity: 0; animation: cascade 1s ease-out forwards; animation-delay: 0.6s; }
    .seq-2 { opacity: 0; animation: cascade 1s ease-out forwards; animation-delay: 1.0s; }
    .line-2 { opacity: 0; animation: cascade 1s ease-out forwards; animation-delay: 1.4s; }
    .seq-3 { opacity: 0; animation: cascade 1s ease-out forwards; animation-delay: 1.8s; }
  </style>

  <!-- BUILD -->
  <g class="seq-1" transform="translate(200, 60)">
    <g transform="translate(-40, -15)">
      <rect x="-16" y="-16" width="32" height="32" rx="6" class="accent-bg"/>
      <path d="M-6,-6 L-10,0 L-6,6 M6,-6 L10,0 L6,6 M-2,8 L2,-8" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="5" class="text-title">BUILD</text>
    </g>
    <text x="0" y="30" class="text-desc" text-anchor="middle">Architecting practical full-stack systems</text>
  </g>

  <!-- Arrow/Line 1 -->
  <line x1="200" y1="105" x2="200" y2="135" class="divider line-1" />
  <path d="M196,131 L200,135 L204,131" class="accent line-1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SOLVE -->
  <g class="seq-2" transform="translate(200, 180)">
    <g transform="translate(-42, -15)">
      <rect x="-16" y="-16" width="32" height="32" rx="6" class="accent-bg"/>
      <circle cx="0" cy="0" r="5" class="accent" stroke-width="1.5" fill="none"/>
      <path d="M0,-8 L0,-5 M0,5 L0,8 M-8,0 L-5,0 M5,0 L8,0 M-6,-6 L-4,-4 M4,4 L6,6 M-6,6 L-4,4 M4,-4 L6,-6" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="25" y="5" class="text-title">SOLVE</text>
    </g>
    <text x="0" y="30" class="text-desc" text-anchor="middle">Tackling algorithmic and technical problems</text>
  </g>

  <!-- Arrow/Line 2 -->
  <line x1="200" y1="225" x2="200" y2="255" class="divider line-2" />
  <path d="M196,251 L200,255 L204,251" class="accent line-2" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SHIP -->
  <g class="seq-3" transform="translate(200, 300)">
    <g transform="translate(-32, -15)">
      <rect x="-16" y="-16" width="32" height="32" rx="6" class="accent-bg"/>
      <path d="M0,-8 L4,-4 V4 L0,8 L-4,4 V-4 Z M-4,4 L-8,8 M4,4 L8,8 M0,8 V12" class="accent" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="5" class="text-title">SHIP</text>
    </g>
    <text x="0" y="30" class="text-desc" text-anchor="middle">Turning ideas into working software</text>
  </g>
</svg>
